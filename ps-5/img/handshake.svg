<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 582" width="760" height="582"><defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#52514e"/></marker></defs><rect x="70" y="10" width="120" height="34" rx="8" fill="#e1e0d9"/><text x="130.0" y="32.0" font-family="Space Grotesk, sans-serif" font-size="14.4" font-weight="600" fill="#0b0b0b" text-anchor="middle">Cliente</text><rect x="630" y="10" width="120" height="34" rx="8" fill="#e1e0d9"/><text x="690.0" y="32.0" font-family="Space Grotesk, sans-serif" font-size="14.4" font-weight="600" fill="#0b0b0b" text-anchor="middle">Servidor</text><line x1="130" y1="44" x2="130" y2="400" stroke="#c3c2b7" stroke-width="2"/><line x1="690" y1="44" x2="690" y2="400" stroke="#c3c2b7" stroke-width="2"/><line x1="130" y1="70" x2="686" y2="110" stroke="#52514e" stroke-width="1.5" marker-end="url(#flecha)"/><rect x="326.4" y="77.0" width="167.2" height="26" rx="6" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/><rect x="334.4" y="85.0" width="10" height="10" rx="2" fill="#2a78d6"/><text x="350.4" y="95.0" font-family="Space Grotesk, sans-serif" font-size="12.0" fill="#52514e"><tspan font-weight="600" fill="#0b0b0b">Initial</tspan> · ClientHello</text><line x1="690" y1="130" x2="134" y2="250" stroke="#52514e" stroke-width="1.5" marker-end="url(#flecha)"/><rect x="326.4" y="132.0" width="167.2" height="26" rx="6" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/><rect x="334.4" y="140.0" width="10" height="10" rx="2" fill="#2a78d6"/><text x="350.4" y="150.0" font-family="Space Grotesk, sans-serif" font-size="12.0" fill="#52514e"><tspan font-weight="600" fill="#0b0b0b">Initial</tspan> · ServerHello</text><rect x="242.5" y="162.0" width="335.0" height="26" rx="6" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.5"/><rect x="250.5" y="170.0" width="10" height="10" rx="2" fill="#eb6834"/><text x="266.5" y="180.0" font-family="Space Grotesk, sans-serif" font-size="12.0" fill="#52514e"><tspan font-weight="600" fill="#0b0b0b">Handshake</tspan> · EncryptedExtensions, Certificate</text><rect x="260.5" y="192.0" width="299.0" height="26" rx="6" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.5"/><rect x="268.5" y="200.0" width="10" height="10" rx="2" fill="#eb6834"/><text x="284.5" y="210.0" font-family="Space Grotesk, sans-serif" font-size="12.0" fill="#52514e"><tspan font-weight="600" fill="#0b0b0b">Handshake</tspan> · CertificateVerify, Finished</text><rect x="287.9" y="222.0" width="244.3" height="26" rx="6" fill="#fcfcfb" stroke="#1baf7a" stroke-width="1.5"/><rect x="295.9" y="230.0" width="10" height="10" rx="2" fill="#1baf7a"/><text x="311.9" y="240.0" font-family="Space Grotesk, sans-serif" font-size="12.0" fill="#52514e"><tspan font-weight="600" fill="#0b0b0b">1-RTT</tspan> · datos 0,5-RTT (opcional)</text><line x1="130" y1="270" x2="686" y2="310" stroke="#52514e" stroke-width="1.5" marker-end="url(#flecha)"/><rect x="328.9" y="262.0" width="162.2" height="26" rx="6" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.5"/><rect x="336.9" y="270.0" width="10" height="10" rx="2" fill="#eb6834"/><text x="352.9" y="280.0" font-family="Space Grotesk, sans-serif" font-size="12.0" fill="#52514e"><tspan font-weight="600" fill="#0b0b0b">Handshake</tspan> · Finished</text><rect x="305.9" y="292.0" width="208.3" height="26" rx="6" fill="#fcfcfb" stroke="#1baf7a" stroke-width="1.5"/><rect x="313.9" y="300.0" width="10" height="10" rx="2" fill="#1baf7a"/><text x="329.9" y="310.0" font-family="Space Grotesk, sans-serif" font-size="12.0" fill="#52514e"><tspan font-weight="600" fill="#0b0b0b">1-RTT</tspan> · STREAM: la petición</text><line x1="690" y1="330" x2="134" y2="370" stroke="#52514e" stroke-width="1.5" marker-end="url(#flecha)"/><rect x="244.7" y="337.0" width="330.7" height="26" rx="6" fill="#fcfcfb" stroke="#1baf7a" stroke-width="1.5"/><rect x="252.7" y="345.0" width="10" height="10" rx="2" fill="#1baf7a"/><text x="268.7" y="355.0" font-family="Space Grotesk, sans-serif" font-size="12.0" fill="#52514e"><tspan font-weight="600" fill="#0b0b0b">1-RTT</tspan> · HANDSHAKE_DONE, STREAM: la respuesta</text><path d="M108,70 H100 V250 H108" fill="none" stroke="#0b0b0b" stroke-width="1.5"/><text x="92.0" y="165.0" font-family="Space Grotesk, sans-serif" font-size="14.4" font-weight="600" fill="#0b0b0b" text-anchor="end">1 RTT</text><circle cx="130" cy="270" r="5" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><text x="92.0" y="275.0" font-family="Space Grotesk, sans-serif" font-size="12.0" font-weight="400" fill="#52514e" text-anchor="end">la petición</text><text x="92.0" y="291.0" font-family="Space Grotesk, sans-serif" font-size="12.0" font-weight="400" fill="#52514e" text-anchor="end">sale aquí</text><text x="40.0" y="440.0" font-family="Space Grotesk, sans-serif" font-size="14.4" font-weight="600" fill="#0b0b0b" text-anchor="start">Los RTT antes de la primera petición</text><text x="40.0" y="458.0" font-family="Space Grotesk, sans-serif" font-size="12.0" font-weight="400" fill="#52514e" text-anchor="start">menos es mejor</text><text x="308.0" y="491.0" font-family="Space Grotesk, sans-serif" font-size="13.2" font-weight="400" fill="#0b0b0b" text-anchor="end">TCP + TLS 1.3</text><path d="M320,476 H676 A4,4 0 0 1 680,480 V492 A4,4 0 0 1 676,496 H320 Z" fill="#52514e"/><text x="688.0" y="491.0" font-family="Space Grotesk, sans-serif" font-size="13.2" font-weight="600" fill="#0b0b0b" text-anchor="start">2 RTT</text><text x="308.0" y="525.0" font-family="Space Grotesk, sans-serif" font-size="13.2" font-weight="400" fill="#0b0b0b" text-anchor="end">QUIC, conexión nueva</text><path d="M320,510 H496 A4,4 0 0 1 500,514 V526 A4,4 0 0 1 496,530 H320 Z" fill="#52514e"/><text x="508.0" y="525.0" font-family="Space Grotesk, sans-serif" font-size="13.2" font-weight="600" fill="#0b0b0b" text-anchor="start">1 RTT</text><text x="308.0" y="559.0" font-family="Space Grotesk, sans-serif" font-size="13.2" font-weight="400" fill="#0b0b0b" text-anchor="end">QUIC, reanudación con 0-RTT</text><text x="328.0" y="559.0" font-family="Space Grotesk, sans-serif" font-size="13.2" font-weight="400" fill="#0b0b0b" text-anchor="start">0 RTT, datos en el primer vuelo</text><line x1="320" y1="470" x2="320" y2="572" stroke="#c3c2b7"/></svg>